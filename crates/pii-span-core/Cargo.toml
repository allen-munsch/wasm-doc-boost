[package]
name = "pii-span-core"
version = "0.5.3"
edition = "2024"
rust-version = "1.88"
description = "Native Rust inference for GLiNER2 on ONNX Runtime (vendored from gliner2-rs 0.9.6)"
license = "Apache-2.0"

[features]
default = ["guardrails", "privacy", "hub"]
guardrails = []
privacy = []
hub = ["dep:hf-hub"]
test-support = []

[dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std", "ndarray", "load-dynamic",
    "cuda", "rocm", "coreml", "openvino", "directml", "tensorrt", "xnnpack", "qnn", "half",
] }
ndarray = "0.17"
tokenizers = { version = "0.23", default-features = false, features = [
    "progressbar",
    "fancy-regex",
] }
anyhow = "1.0"
half = "2.4"
regex = "1.11"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"], optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
