[package]
name = "pdf-inspector-core"
version = "0.1.0"
edition = "2021"
authors = ["Firecrawl Team"]
description = "Vendored PDF inspection core from firecrawl/pdf-inspector for wasm-doc-boost"
license = "MIT"
repository = "https://github.com/firecrawl/pdf-inspector"
include = [
    "/src/**",
    "/external/bcmaps/**",
]

[lib]
name = "pdf_inspector_core"
crate-type = ["lib"]

[dependencies]
thiserror = "2.0"
log = "0.4"
regex = "1.10"
once_cell = "1.19"
unicode-normalization = "0.1"
ttf-parser = "0.25"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { version = "0.42.0", features = ["rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { version = "0.42.0", default-features = false, features = ["wasm_js"] }
include_dir = "0.7"
