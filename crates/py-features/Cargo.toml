[package]
name = "py-features"
version = "0.5.3"
edition = "2021"

[lib]
name = "py_features"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
features-core = { path = "../features-core" }
gbdt-core = { path = "../gbdt-core" }
pdf-inspector-core = { path = "../pdf-inspector-core" }
pii-core = { path = "../pii-core" }
ocr-core = { path = "../ocr-core" }
pii-span-core = { path = "../pii-span-core" }
layout-core = { path = "../layout-core" }
image = "0.25"
libloading = { version = "0.8", optional = true }

[features]
default = []
# CUDA backend: dlopens libcuda.so.1 at runtime, embeds precompiled PTX.
gpu = ["dep:libloading"]
