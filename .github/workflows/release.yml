name: Build and release wheels + wasm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            target: ""
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: ""
          - name: macos-amd64
            runner: macos-14
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-14
            target: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto
          target: ${{ matrix.target }}
          working-directory: crates/py-features

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Smoke test wheel (legacy + v3 parity)
        if: matrix.target == ''
        working-directory: crates/py-features
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index --find-links dist py-features
          python - <<'PY'
          import py_features

          # Release build flag
          assert py_features.is_release_build() is True

          # Legacy feature vector (103)
          assert len(py_features.extract_all(bytes(3), 1, 1)) == 103

          # Per-degree feature vector (124) — the shared core path
          assert len(py_features.extract_all_v2(bytes(64 * 64 * 3), 64, 64)) == 124

          # v2 model parity: load the manifest, predict on the same pixels,
          # get the same combine_rotation outputs the wasm frontend returns.
          manifest = {
              "labels": ["is_document", "is_digital", "is_paper", "is_crumpled",
                          "is_shadow", "flip", "trust"],
              "tau": 0.9,
              "version": "0.5.0",
              "trees": [[{"nodeid": 0, "depth": 0, "leaf": 0.0}]] * 7,
              "trees_per_label": [1, 1, 1, 1, 1, 1, 1],
          }
          import json
          py_features.load_model_v2(json.dumps(manifest))
          assert py_features.model_version() == "0.5.0"

          result = py_features.predict_v2(bytes(64 * 64 * 3), 64, 64)
          assert len(result) == 16, result.keys()
          assert "rotation_deg" in result
          assert "rotation_confidence" in result
          assert "needs_review" in result
          print("wheel OK: legacy 103 + v2 124 + predict_v2 parity")
          PY

      - name: Verify cross-compiled wheel architecture
        if: matrix.target == 'x86_64-apple-darwin'
        working-directory: crates/py-features
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl | head -1)
          case "$wheel" in
            *x86_64*) echo "wheel tag OK: $wheel" ;;
            *) echo "unexpected wheel tag: $wheel"; exit 1 ;;
          esac
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as z:
              so = [n for n in z.namelist() if n.endswith(".so")]
              assert so, z.namelist()
              open("extracted.so", "wb").write(z.read(so[0]))
          PY
          lipo -info extracted.so | grep -q x86_64
          echo "cross-compiled wheel is x86_64"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: crates/py-features/dist/*.whl
          if-no-files-found: error

  wasm:
    name: wasm package + model
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm32 target + wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Build wasm package
        run: wasm-pack build --target web crates/wasm-bridge

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist-wasm
          cp crates/wasm-bridge/pkg/*.js \
             crates/wasm-bridge/pkg/*.d.ts \
             crates/wasm-bridge/pkg/*.wasm \
             dist-wasm/
          cp frontend/model.json dist-wasm/model.json
          ls -la dist-wasm

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: dist-wasm/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload wheels + wasm + model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.whl
          gh release upload "$GITHUB_REF_NAME" dist/*.js dist/*.d.ts dist/*.wasm dist/model.json
