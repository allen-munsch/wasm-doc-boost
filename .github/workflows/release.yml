name: Build and release wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            target: ""
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: ""
          - name: macos-amd64
            runner: macos-14
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-14
            target: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto
          target: ${{ matrix.target }}
          working-directory: crates/py-features

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Smoke test wheel
        if: matrix.target == ''
        working-directory: crates/py-features
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index --find-links dist py-features
          python -c "import py_features; assert py_features.is_release_build() is True; assert len(py_features.extract_all(bytes(3), 1, 1)) == 103; print('wheel OK')"

      - name: Verify cross-compiled wheel architecture
        if: matrix.target == 'x86_64-apple-darwin'
        working-directory: crates/py-features
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl | head -1)
          case "$wheel" in
            *x86_64*) echo "wheel tag OK: $wheel" ;;
            *) echo "unexpected wheel tag: $wheel"; exit 1 ;;
          esac
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as z:
              so = [n for n in z.namelist() if n.endswith(".so")]
              assert so, z.namelist()
              open("extracted.so", "wb").write(z.read(so[0]))
          PY
          lipo -info extracted.so | grep -q x86_64
          echo "cross-compiled wheel is x86_64"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: crates/py-features/dist/*.whl
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload wheels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.whl
